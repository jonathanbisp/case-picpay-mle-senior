[project]
name = "case-picpay-mle-senior"
version = "0.1.0"
description = "Projeto desenvolvido como case técnico para a vaga de Engenheiro de MLE Sênior no PicPay"
authors = [
    {name = "Jonathan Bispo",email = "jonathanbispo.pessoal@gmail.com"}
]
requires-python = ">3.13,<3.15"
dependencies = [
    "spacy (>=3.8.11,<4.0.0)",
    "fastapi[standard] (>=0.128.7,<0.129.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "pymongo (>=4.16.0,<5.0.0)",
    "anyio (>=4.12.1,<5.0.0)",
    "starlette (>=0.52.1,<0.53.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "loguru (>=0.7.3,<0.8.0)"
]

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
test = [
    "pytest (>=9.0.2,<10.0.0)",
    "ruff (>=0.15.0,<0.16.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "mongomock (>=4.3.0,<5.0.0)",
    "mongomock-motor (>=0.0.36,<0.0.37)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "testcontainers[mongodb] (>=4.14.1,<5.0.0)"
]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)"
]

[tool.ruff]
exclude = [
    "*.ipynb",
]

[tool.ruff.lint]
ignore = [
    "F403",
]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "src"
]
testpaths = [
  "tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
