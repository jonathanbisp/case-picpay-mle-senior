services:
  api:
    build: .
    restart: always
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://mongo:27017/picpay
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: picpay_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  mongo:
    image: mongo:7
    container_name: picpay_mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

volumes:
  mongo_data:
